<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For My Friend ❤️</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <button id="startBtn">Start ❤️</button>

    <div class="scene">

        <!-- Friend's photo -->
        <div class="photo-container friend-photo">
            <img src="/friend.jpg" alt="My friend">
        </div>

        <!-- Heart made from "I luv u" -->
        <div id="textHeart"></div>

        <!-- My photo -->
        <div class="photo-container my-photo" id="myPhoto">
            <img src="/me.jpg" alt="Me">
        </div>

        <!-- Flying hearts -->
        <div id="flyingHearts"></div>

    </div>

    <script src="/script.js"></script>

</body>
</html>
